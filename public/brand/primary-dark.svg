<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <radialGradient id="disc-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1723"/>
      <stop offset="85%" stop-color="#1e1119"/>
      <stop offset="100%" stop-color="#160c12"/>
    </radialGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- VINYL RECORD ICON -->
  <g transform="translate(60, 40)">
    <!-- Base Disc -->
    <circle cx="120" cy="120" r="110" fill="url(#disc-base)" stroke="#f7809c" stroke-width="5" stroke-opacity="0.85"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#f7809c" stroke-width="1.5" stroke-opacity="0.2"/>

    <!-- Outer Grooves -->
    <path d="M 58 74 A 77 77 0 0 0 58 166" stroke="#f7809c" stroke-width="6" stroke-linecap="round"/>
    <path d="M 182 74 A 77 77 0 0 1 182 166" stroke="#f7809c" stroke-width="6" stroke-linecap="round"/>

    <!-- Mid Grooves -->
    <path d="M 73 87 A 57 57 0 0 0 73 153" stroke="#f7809c" stroke-width="5" stroke-linecap="round"/>
    <path d="M 167 87 A 57 57 0 0 1 167 153" stroke="#f7809c" stroke-width="5" stroke-linecap="round"/>

    <!-- Center Spindle Disc -->
    <circle cx="120" cy="120" r="24" fill="#f7809c"/>
    <circle cx="120" cy="120" r="10" fill="#1e1119" stroke="#f7809c" stroke-width="1.5"/>
  </g>

  <!-- WORDMARK (Preserved exact text) -->
  <text x="320" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="88" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">Melody</tspan><tspan fill="url(#grad-rose)">Map</tspan>
  </text>

  <!-- TAGLINE (Preserved exact text) -->
  <text x="322" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="500" letter-spacing="3" fill="#a58c97">
    YOUR MUSIC. YOUR MOOD. YOUR MAP.
  </text>
</svg>

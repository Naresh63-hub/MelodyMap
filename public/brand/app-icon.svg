<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Vibrant Magenta -->
    <linearGradient id="mmBg" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#4924F9" />
      <stop offset="40%" stop-color="#7016EC" />
      <stop offset="75%" stop-color="#BD1BE8" />
      <stop offset="100%" stop-color="#E32BFD" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="mmWave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.5" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="mmWave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="mmGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>

    <!-- Note Shadow -->
    <filter id="mmNoteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#180438" flood-opacity="0.3" />
    </filter>

    <clipPath id="mmSquircleClip">
      <rect x="36" y="36" width="440" height="440" rx="132" ry="132" />
    </clipPath>
  </defs>

  <!-- Ambient Lavender Glow Outer Border (Critical Brand Requirement) -->
  <rect x="22" y="22" width="468" height="468" rx="144" ry="144" fill="none" stroke="#D4C4FC" stroke-width="8" filter="url(#mmGlow)" />
  
  <!-- Crisp Inner White Contour -->
  <rect x="31" y="31" width="450" height="450" rx="138" ry="138" fill="none" stroke="#FFFFFF" stroke-width="4" />

  <!-- Core Rounded-Square with Gradient & Bottom Wave Ribbons -->
  <g clip-path="url(#mmSquircleClip)">
    <!-- Base Gradient -->
    <rect x="36" y="36" width="440" height="440" fill="url(#mmBg)" />

    <!-- Flowing Wave Ribbons -->
    <path d="M 36,410 Q 150,330 260,390 T 476,380 L 476,476 L 36,476 Z" fill="url(#mmWave1)" />
    <path d="M 36,435 Q 160,370 280,410 T 476,395 L 476,476 L 36,476 Z" fill="url(#mmWave2)" />
    <path d="M 36,455 Q 180,400 310,430 T 476,420 L 476,476 L 36,476 Z" fill="#F9A8D4" fill-opacity="0.4" />
  </g>

  <!-- White Beamed Musical Note Symbol (♫) -->
  <g filter="url(#mmNoteShadow)" fill="#FFFFFF">
    <!-- Connecting Horizontal/Slanted Beam -->
    <path d="M 218,172 L 328,142 C 334,140 340,144 340,150 L 340,192 C 340,197 335,200 330,202 L 218,232 C 212,234 206,230 206,224 L 206,182 C 206,177 211,173 218,172 Z" />

    <!-- Left Stem -->
    <rect x="206" y="180" width="18" height="164" rx="5" />

    <!-- Right Stem -->
    <rect x="322" y="150" width="18" height="160" rx="5" />

    <!-- Left Note Head (Angled Oval) -->
    <ellipse cx="184" cy="340" rx="38" ry="28" transform="rotate(-24 184 340)" />

    <!-- Right Note Head (Angled Oval) -->
    <ellipse cx="300" cy="306" rx="38" ry="28" transform="rotate(-24 300 306)" />
  </g>
</svg>

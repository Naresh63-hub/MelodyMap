<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Signature MelodyMap Sunset-to-Cosmic Violet Gradient -->
    <linearGradient id="mmBgGrad" x1="0.1" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="22%" stop-color="#4C1D95" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="68%" stop-color="#A855F7" />
      <stop offset="85%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#FF8A35" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="mmGloss" x1="0.5" y1="0" x2="0.5" y2="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Ambient Rim Glow -->
    <linearGradient id="mmRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Note Drop Shadow for 3D Depth -->
    <filter id="mmNoteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15062C" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Smooth Continuous Curvature -->
  <rect x="0" y="0" width="512" height="512" rx="124" ry="124" fill="url(#mmBgGrad)" />

  <!-- Top Glass Highlight Overlay -->
  <path d="M 0,124 C 0,55 55,0 124,0 L 388,0 C 457,0 512,55 512,124 L 512,230 C 390,260 122,260 0,230 Z" fill="url(#mmGloss)" />

  <!-- Subtle Inner Border Rim -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="122.5" ry="122.5" fill="none" stroke="url(#mmRim)" stroke-width="3" />

  <!-- Iconic Musical Note (Pure White Beamed Double Note) -->
  <g filter="url(#mmNoteShadow)">
    <!-- Left Note Head (Rotated Ellipse) -->
    <ellipse cx="196" cy="346" rx="46" ry="34" transform="rotate(-26 196 346)" fill="#FFFFFF" />

    <!-- Right Note Head (Rotated Ellipse, positioned slightly higher) -->
    <ellipse cx="334" cy="316" rx="46" ry="34" transform="rotate(-26 334 316)" fill="#FFFFFF" />

    <!-- Left Vertical Stem -->
    <rect x="220" y="146" width="22" height="196" rx="6" ry="6" fill="#FFFFFF" />

    <!-- Right Vertical Stem -->
    <rect x="358" y="116" width="22" height="196" rx="6" ry="6" fill="#FFFFFF" />

    <!-- Connecting Upper Beamed Bar (Thick Slanted Music Bar) -->
    <path d="M 220,172 L 380,140 L 380,116 L 220,148 Z" fill="#FFFFFF" />
  </g>
</svg>
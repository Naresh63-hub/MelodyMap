<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 322" width="920" height="322">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Vibrant Magenta -->
    <linearGradient id="logoBg" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#4924F9" />
      <stop offset="40%" stop-color="#7016EC" />
      <stop offset="75%" stop-color="#BD1BE8" />
      <stop offset="100%" stop-color="#E32BFD" />
    </linearGradient>

    <!-- Waves -->
    <linearGradient id="logoWave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="logoWave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.7" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.3" />
    </filter>

    <clipPath id="logoSquircleClip">
      <rect x="42" y="42" width="238" height="238" rx="72" ry="72" />
    </clipPath>
  </defs>

  <!-- ICON ON LEFT -->
  <!-- Lavender Glow Outer Border -->
  <rect x="34" y="34" width="254" height="254" rx="78" ry="78" fill="none" stroke="#D4C4FC" stroke-width="5" filter="url(#logoGlow)" />
  <!-- White Inner Contour -->
  <rect x="39" y="39" width="244" height="244" rx="75" ry="75" fill="none" stroke="#FFFFFF" stroke-width="3" />

  <g clip-path="url(#logoSquircleClip)">
    <rect x="42" y="42" width="238" height="238" fill="url(#logoBg)" />
    <path d="M 42,240 Q 100,200 160,230 T 280,225 L 280,280 L 42,280 Z" fill="url(#logoWave1)" />
    <path d="M 42,255 Q 110,220 175,245 T 280,235 L 280,280 L 42,280 Z" fill="url(#logoWave2)" />
  </g>

  <!-- Beamed Double Musical Note -->
  <g fill="#FFFFFF">
    <path d="M 140,116 L 200,100 C 204,99 207,101 207,105 L 207,128 C 207,131 204,133 201,134 L 140,150 C 137,151 133,149 133,145 L 133,122 C 133,119 136,117 140,116 Z" />
    <rect x="133" y="120" width="10" height="90" rx="3" />
    <rect x="197" y="104" width="10" height="88" rx="3" />
    <ellipse cx="121" cy="208" rx="21" ry="15" transform="rotate(-24 121 208)" />
    <ellipse cx="185" cy="189" rx="21" ry="15" transform="rotate(-24 185 189)" />
  </g>

  <!-- WORDMARK ON RIGHT (Light Theme: Melody in Dark Indigo, Map in Vibrant Purple) -->
  <text x="325" y="200" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="124" font-weight="800" letter-spacing="-2px">
    <tspan fill="#080138">Melody</tspan><tspan fill="#8E2EFC">Map</tspan>
  </text>
</svg>

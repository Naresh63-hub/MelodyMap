<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="disc-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1723"/>
      <stop offset="85%" stop-color="#1e1119"/>
      <stop offset="100%" stop-color="#160c12"/>
    </radialGradient>
  </defs>
  <!-- Midnight Plum Vinyl Record Base Disc -->
  <circle cx="256" cy="256" r="236" fill="url(#disc-base)" stroke="#f7809c" stroke-width="10" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f7809c" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Outer Vinyl Sound Groove Arcs -->
  <path d="M 124.2 156.7 A 165 165 0 0 0 124.2 355.3" stroke="#f7809c" stroke-width="12" stroke-linecap="round"/>
  <path d="M 387.8 156.7 A 165 165 0 0 1 387.8 355.3" stroke="#f7809c" stroke-width="12" stroke-linecap="round"/>

  <!-- Mid Vinyl Sound Groove Arcs -->
  <path d="M 156.1 186.0 A 122 122 0 0 0 156.1 326.0" stroke="#f7809c" stroke-width="10" stroke-linecap="round"/>
  <path d="M 355.9 186.0 A 122 122 0 0 1 355.9 326.0" stroke="#f7809c" stroke-width="10" stroke-linecap="round"/>

  <!-- Inner Subtle Sound Groove Arcs -->
  <path d="M 181.5 213.0 A 86 86 0 0 0 181.5 299.0" stroke="#f7809c" stroke-width="6" stroke-linecap="round" stroke-opacity="0.65"/>
  <path d="M 330.5 213.0 A 86 86 0 0 1 330.5 299.0" stroke="#f7809c" stroke-width="6" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Center Spindle Disc -->
  <circle cx="256" cy="256" r="48" fill="#f7809c"/>
  <circle cx="256" cy="256" r="20" fill="#1e1119" stroke="#f7809c" stroke-width="2"/>
</svg>
